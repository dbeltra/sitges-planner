<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sitges 2026 Planner</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap">
<style>
  /* Sitges Film Festival look: black bar, #FF0042 band, #ECE6DC ground, Clash Display + Montserrat. Light only, like the site. */
  :root {
    color-scheme: light;
    --px: 1.4px;
    --ground: #ECE6DC; --surface: #FFFFFF; --ink: #000000; --muted: #5E5850; --line: #D2CABD; --line-soft: #DDD6CA;
    --red: #FF0042; --gold: #B78B4B; --yellow: #FFED00;
    --mine-bg: #000000; --mine-ink: #FFFFFF; --mine-muted: #B7B3AB;
    --clash: #FF0042; --tight: #F34B15; --repeat: #9B85D6; --rest: #0071B3; --band: rgb(255 0 66 / .08); --band-edge: rgb(255 0 66 / .55);
    --stripe-l: .55; --stripe-c: .16;
    --display: "Clash Display", "Arial Black", Arial, sans-serif;
    --body: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font: 13px/1.35 var(--body); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* Top bar: black, red letter-spaced dates, white controls */
  .topbar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; background: #000; color: #fff; }
  .dates { font: 700 13px/1 var(--body); letter-spacing: 3px; text-transform: uppercase; color: var(--red); white-space: nowrap; }
  .dates span + span { color: var(--gold); letter-spacing: 1px; text-transform: none; margin-left: 14px; }
  .controls { display: flex; gap: 18px; align-items: center; font-weight: 600; }
  .controls label { display: flex; gap: 7px; align-items: center; white-space: nowrap; cursor: pointer; }
  .controls input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--red); }
  .walk-open { padding: 4px 10px; border: 1px solid #fff; border-radius: 0; background: none; color: #fff; font-weight: 600; cursor: pointer; }
  .walk-open:hover { background: #fff; color: #000; }
  dialog { width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; border: 0; border-top: 6px solid var(--red); background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgb(0 0 0 / .55); }
  dialog form { display: grid; gap: 14px; padding: 20px 22px; }
  dialog h2 { margin: 0; font: 700 26px/1 var(--display); text-transform: uppercase; }
  dialog p { margin: 0; color: var(--muted); max-width: 60ch; }
  .walk-rows { display: grid; gap: 2px; }
  .rest-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px; background: var(--ground); font-size: 12px; }
  .rest-row input { width: 64px; padding: 4px 6px; border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; text-align: right; }
  .rest-row small { color: var(--muted); }
  .clear-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .clear-row button { padding: 8px 12px; border: 1px solid var(--clash); border-radius: 0; background: none; color: var(--clash); font-weight: 700; font-size: 12px; cursor: pointer; }
  .clear-row button:disabled { border-color: var(--line); color: var(--muted); cursor: default; }
  .clear-row button.confirm { background: var(--clash); color: #fff; }
  .clear-row button.undo { border-color: var(--ink); color: var(--ink); }
  .set-h { margin: 4px 0 -6px; font: 700 11px/1 var(--body); letter-spacing: 1.63px; text-transform: uppercase; }
  .walk-rows label { display: grid; grid-template-columns: 1fr auto 1fr 56px auto; gap: 8px; align-items: center; padding: 5px 8px; background: var(--ground); font-size: 12px; font-weight: 500; }
  .walk-rows label.changed { box-shadow: inset 3px 0 0 var(--red); }
  .walk-rows label span:nth-child(2) { color: var(--muted); }
  .walk-rows input { width: 56px; padding: 3px 6px; border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; text-align: right; }
  .walk-rows small { color: var(--muted); }
  .walk-actions { display: flex; justify-content: space-between; gap: 8px; }
  .walk-actions button { padding: 8px 14px; border: 1px solid var(--ink); border-radius: 0; background: none; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; cursor: pointer; }
  .walk-actions .primary { background: var(--ink); color: var(--surface); }
  @media (max-width: 480px) { .walk-rows label { grid-template-columns: 1fr 56px auto; } .walk-rows label span { grid-column: 1; } .walk-rows label span:nth-child(2) { display: none; } .walk-rows input, .walk-rows small { grid-row: 1 / span 2; } }
  .controls input[type=number] { width: 52px; padding: 3px 6px; border: 1px solid #3B3B3B; border-radius: 0; background: #1E1E1E; color: #fff; font-variant-numeric: tabular-nums; }

  /* Red band: brand + days */
  header { display: flex; gap: 12px 24px; align-items: center; padding: 10px 16px; background: var(--red); color: #000; }
  .brand { font: 700 30px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  nav { display: flex; gap: 2px; padding-top: 8px; margin-top: -8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; justify-content: flex-end; }
  nav button { position: relative; display: grid; justify-items: center; gap: 2px; min-width: 52px; padding: 6px 8px 5px; border: 0; background: none; cursor: pointer; }
  nav button small { font: 700 10px/1 var(--body); text-transform: uppercase; letter-spacing: 1.63px; }
  nav button strong { font: 700 24px/1 var(--display); }
  nav button:hover { color: #fff; }
  nav button[aria-pressed="true"] { background: #000; color: #fff; }
  nav button[aria-pressed="true"] small::before { content: "★ "; color: var(--red); }
  nav button i { position: absolute; top: -7px; right: -4px; z-index: 1; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--yellow); color: #000; font: 700 10px/15px var(--body); font-style: normal; }
  nav button i.bad { background: #000; color: var(--yellow); }
  nav button[aria-pressed="true"] i.bad { background: var(--yellow); color: #000; }

  /* Summary line */
  .status { display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .status b { color: var(--ink); font-weight: 700; }
  .status .k { display: inline-flex; gap: 6px; align-items: center; }
  .status .sw { width: 11px; height: 11px; }
  .sw.mine { background: var(--mine-bg); box-shadow: inset 0 0 0 2px var(--yellow); }
  .sw.clash { background: var(--clash); }
  .sw.tight { background: var(--tight); }
  .sw.rest { background: var(--rest); }
  .sw.repeat { background: none; outline: 2px dashed var(--repeat); outline-offset: -2px; }
  .status .hint { margin-left: auto; }

  /* Grid */
  #scroller { flex: 1; overflow: auto; overscroll-behavior: contain; }
  #grid { display: grid; position: relative; min-width: min-content; padding-bottom: 24px; }
  .head { position: sticky; top: 0; z-index: 8; padding: 10px 8px 8px; background: var(--ground); border-bottom: 2px solid #000;
          font: 600 15px/1.1 var(--display); letter-spacing: .02em; text-transform: uppercase; text-align: center; text-wrap: balance; }
  .head.corner { left: 0; z-index: 9; }
  .head { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .head .hide { flex: none; width: 20px; height: 20px; padding: 0; border: 0; background: none; color: var(--muted); font: 600 12px/1 var(--body); cursor: pointer; opacity: .45; }
  .head:hover .hide, .head .hide:focus-visible { opacity: 1; }
  .head .hide:hover { color: var(--red); }
  .hidden-venues { flex-wrap: wrap; }
  .hidden-venues button { padding: 2px 8px; border: 1px solid var(--ink); border-radius: 0; background: var(--surface); font: 600 11px/1.4 var(--body); cursor: pointer; }
  .hidden-venues button:hover { background: var(--ink); color: var(--surface); }
  .hidden-venues button i { font-style: normal; color: var(--red); }
  .col { position: relative; min-width: 180px; border-left: 1px solid var(--line-soft); }
  .col.axis { position: sticky; left: 0; z-index: 6; min-width: 0; border: 0; background: var(--ground); }
  .hour { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line-soft); }
  .hour.half { border-top-style: dashed; opacity: .7; }
  .axis .hour { border: 0; }
  .axis .hour span { position: absolute; top: -7px; right: 8px; font: 600 11px/1 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
  .axis .midnight span { color: var(--ink); font-weight: 700; }
  .col .midnight { border-top: 1px dashed var(--ink); opacity: .45; }

  /* Session blocks */
  .s { position: absolute; left: 4px; right: 4px; overflow: hidden; padding: 5px 7px 5px 10px; cursor: pointer;
       background: var(--surface); border: 0;
       box-shadow: inset 4px 0 0 oklch(var(--stripe-l) var(--stripe-c) var(--h)); transition: box-shadow .12s; }
  .s:hover, .s:focus-visible { z-index: 5; overflow: visible; height: auto !important; min-height: var(--hgt); box-shadow: inset 4px 0 0 oklch(var(--stripe-l) var(--stripe-c) var(--h)), 0 6px 18px rgb(0 0 0 / .15); }
  .s .t { display: flex; justify-content: space-between; gap: 6px; font: 600 11px/1.3 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
  .s .t a { color: inherit; text-decoration: none; padding: 0 2px; }
  .s .t a:hover { color: var(--red); }
  .s h3 { margin: 2px 0 1px; font: 600 15px/1.1 var(--display); letter-spacing: .01em; text-wrap: balance; }
  .s .who { color: var(--muted); font-size: 12px; }
  .s ul { margin: 2px 0; padding-left: 13px; font-size: 12px; color: var(--muted); }
  .s ul li::marker { content: "★ "; color: var(--red); font-size: 9px; }
  .s .sec { margin-top: 3px; font: 700 9.5px/1.3 var(--body); text-transform: uppercase; letter-spacing: 1px; color: oklch(var(--stripe-l) var(--stripe-c) var(--h)); }
  .s .note { display: block; margin-top: 4px; font-size: 12px; font-weight: 700; }
  .s .note.warn { color: var(--clash); }
  .s .note.tight { color: var(--tight); }
  .s .note.repeat { color: var(--repeat); }
  .s .note.rest { color: #5AB0F0; }
  .s:not(.on) .note.rest, .sheet .notes .rest { color: var(--rest); }
  .s .note.gap { font-weight: 500; color: var(--muted); }

  .s.on { background: var(--mine-bg); color: var(--mine-ink); box-shadow: inset 0 0 0 2px var(--yellow); }
  .s.on:hover, .s.on:focus-visible { box-shadow: inset 0 0 0 2px var(--yellow), 0 6px 18px rgb(0 0 0 / .25); }
  .s.on .t, .s.on .who, .s.on ul, .s.on .note.gap { color: var(--mine-muted); }
  .s.on .t::before { content: "★ "; color: var(--yellow); }
  .s.on .t { justify-content: flex-start; }
  .s.on .t a { margin-left: auto; }
  .s.on .sec { color: oklch(.78 .12 var(--h)); }
  .s.on.rest { box-shadow: inset 0 0 0 3px var(--rest); }
  .s.on.tight { box-shadow: inset 0 0 0 3px var(--tight); }
  .s.on.clash { box-shadow: inset 0 0 0 3px var(--clash); }
  .s.on.repeat { outline: 2px dashed var(--repeat); outline-offset: 2px; }

  .only .s:not(.on) { display: none; }

  /* Now line and next-session bar */
  #nowline { position: absolute; left: 0; right: 0; z-index: 7; height: 0; border-top: 2px solid var(--red); pointer-events: none; }
  #nowline::before { content: attr(data-t); position: absolute; left: 2px; top: -9px; padding: 1px 4px; background: var(--red); color: #fff; font: 700 10px/14px var(--body); font-variant-numeric: tabular-nums; }
  .next { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; width: 100%; padding: 7px 16px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; font-size: 13px; cursor: pointer; }
  [hidden] { display: none !important; }
  .next b { font-family: var(--display); font-weight: 600; font-size: 14px; }
  .next .lbl { font-weight: 700; font-size: 10px; letter-spacing: 1.63px; text-transform: uppercase; color: var(--red); }
  .next .when { color: var(--muted); }
  .next .leave { font-weight: 700; }
  .next .leave.late { color: var(--clash); }

  /* Info button on blocks */
  .s .t .info { flex: none; width: 18px; height: 18px; margin: -2px -3px 0 0; padding: 0; border: 0; border-radius: 50%; background: none; color: inherit; font: 700 12px/18px var(--body); cursor: pointer; }
  .s .t .info:hover { color: var(--red); }
  .s.on .t .info { margin-left: auto; }

  /* Detail sheet */
  .sheet { width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; border: 0; border-top: 6px solid var(--red); background: var(--surface); color: var(--ink); overflow: auto; }
  .sheet::backdrop, #syncDialog::backdrop { background: rgb(0 0 0 / .55); }
  .sheet-body { display: grid; gap: 12px; padding: 18px 20px 20px; }
  .posters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .posters img { flex: none; width: 96px; aspect-ratio: 291 / 434; object-fit: cover; background: var(--ground); }
  .sheet h2:focus { outline: none; }
  .sheet h2 { margin: 0; font: 700 24px/1.05 var(--display); text-wrap: balance; }
  .sheet .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sheet .meta span:last-child { color: var(--muted); font-weight: 500; }
  .sheet .secs { display: flex; flex-wrap: wrap; gap: 4px; }
  .sheet .secs span { padding: 2px 7px; font: 700 10px/1.4 var(--body); letter-spacing: 1px; text-transform: uppercase; color: #fff; background: oklch(var(--stripe-l) var(--stripe-c) var(--h)); }
  .sheet ol { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .sheet li a { font-weight: 700; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .sheet li a:hover { color: var(--red); border-color: var(--red); }
  .sheet li small { display: block; color: var(--muted); font-size: 12px; }
  .sheet .syn { margin: 4px 0 0; max-width: 62ch; font-size: 13px; line-height: 1.5; }
  .sheet ol { gap: 12px; }
  .sheet .notes .note { display: block; font-weight: 700; font-size: 13px; }
  .sheet .notes .warn { color: var(--clash); } .sheet .notes .tight { color: var(--tight); }
  .sheet .notes .repeat { color: #6B55B0; } .sheet .notes .gap { color: var(--muted); font-weight: 500; }

  /* Films view */
  #watchCount:not(:empty) { margin-left: 5px; padding: 0 5px; background: var(--red); color: #fff; font-size: 10px; }
  .films { width: min(760px, calc(100% - 32px)); height: min(88%, 900px); padding: 0; border: 0; border-top: 6px solid var(--red); background: var(--surface); color: var(--ink); }
  .films[open] { display: flex; flex-direction: column; }
  .films::backdrop { background: rgb(0 0 0 / .55); }
  .films-head { display: grid; gap: 10px; padding: 16px 20px 10px; border-bottom: 1px solid var(--line); }
  .films-top { display: flex; justify-content: space-between; align-items: center; }
  .films h2:focus { outline: none; }
  .films h2 { margin: 0; font: 700 26px/1 var(--display); text-transform: uppercase; }
  .films-close { width: 32px; height: 32px; border: 0; background: none; font-size: 18px; cursor: pointer; }
  .tabs { display: flex; gap: 0; }
  .tabs button { padding: 7px 12px; border: 1px solid var(--ink); background: none; font-weight: 700; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  .tabs button + button { border-left: 0; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
  .films-filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .films-filters input, .films-filters select { flex: 1 1 200px; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 0; background: var(--ground); font: inherit; }
  .films-summary { margin: 0; min-height: 1.35em; font-size: 12px; color: var(--muted); }
  .films-summary b { color: var(--ink); }
  .film-list { flex: 1; overflow: auto; margin: 0; padding: 0 20px 20px; list-style: none; }
  .film { display: grid; grid-template-columns: 54px 1fr auto; gap: 4px 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .film img { grid-row: span 3; width: 54px; aspect-ratio: 291 / 434; object-fit: cover; background: var(--ground); }
  .film .ft { font: 600 15px/1.15 var(--display); }
  .film .fd { font-size: 12px; color: var(--muted); }
  .film .fs { display: flex; flex-wrap: wrap; gap: 4px; grid-column: 2 / -1; }
  .film .fs button { padding: 2px 6px; border: 1px solid var(--line); background: var(--ground); font: 600 11px/1.4 var(--body); font-variant-numeric: tabular-nums; cursor: pointer; }
  .film .fs button:hover { border-color: var(--ink); }
  .film .fs button.on { background: var(--mine-bg); color: var(--mine-ink); border-color: var(--mine-bg); }
  .film .fs button.off { opacity: .5; text-decoration: line-through; }
  .film .fsec { font: 700 9.5px/1.3 var(--body); text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .film .acts { display: flex; gap: 4px; grid-row: 1 / span 2; grid-column: 3; }
  .film .acts button { min-width: 34px; height: 30px; padding: 0 8px; border: 1px solid var(--ink); background: none; font-weight: 700; cursor: pointer; }
  .film .acts button.on { background: var(--ink); color: var(--surface); }
  .film .acts .must.on { background: var(--red); border-color: var(--red); color: #fff; }
  .film .st { grid-column: 2 / -1; font-size: 12px; font-weight: 600; }
  .film .st.covered { color: #2E7D32; } .film .st.open { color: var(--muted); } .film .st.blocked { color: var(--clash); }
  .film-list .empty { padding: 30px 0; color: var(--muted); text-align: center; }
  .s .t .wl { color: var(--red); font-size: 10px; margin-left: auto; }
  .s .t .wl + .info { margin-left: 2px; }
  .sheet .wbtn { margin-left: 6px; padding: 1px 7px; border: 1px solid var(--ink); background: none; font: 700 10px/1.6 var(--body); letter-spacing: .5px; text-transform: uppercase; cursor: pointer; vertical-align: 2px; }
  .sheet .wbtn.on { background: var(--ink); color: var(--surface); }

  /* Sync */
  #syncDialog { width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; border: 0; border-top: 6px solid var(--red); background: var(--surface); color: var(--ink); }
  .sync-part { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .sync-part h3 { margin: 0; font: 700 11px/1 var(--body); letter-spacing: 1.63px; text-transform: uppercase; }
  .sync-summary { min-height: 1.35em; font-size: 12px; }
  #syncDialog textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); background: var(--ground); font: 11px/1.4 ui-monospace, Menlo, monospace; resize: vertical; word-break: break-all; }
  .walk-actions button:disabled { opacity: .4; cursor: default; }
  #band { position: absolute; left: 0; right: 0; z-index: 1; background: var(--band); border-block: 1px dashed var(--band-edge); pointer-events: none; }

  .short { display: none; }
  @media (max-width: 640px) {
    :root { --px: 1.2px; }
    .short { display: inline; }
    .long, .dates, .brand, .status .hint, .status .k.key { display: none; }
    /* Phone: days first, then one line of controls, then one line of summary */
    header { order: 1; padding: calc(4px + env(safe-area-inset-top, 0px)) 8px 4px; }
    .topbar { order: 2; padding: 4px 12px; }
    .status, .next { order: 3; }
    #scroller { order: 4; }
    nav { justify-content: flex-start; padding-top: 7px; margin-top: -7px; }
    nav button { min-width: 38px; padding: 3px 5px; gap: 1px; }
    nav button small { font-size: 8.5px; letter-spacing: 1px; }
    nav button strong { font-size: 19px; }
    nav button[aria-pressed="true"] small::before { content: none; }
    .controls { width: 100%; gap: 6px; font-size: 12px; }
    .controls label { margin-right: auto; }
    .walk-open { padding: 2px 8px; font-size: 12px; }
    .status { flex-wrap: nowrap; gap: 12px; padding: 4px 12px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; font-size: 11.5px; }
    .hidden-venues { flex-wrap: nowrap; }
    .head { padding: 6px 4px 5px; font-size: 12.5px; }
    .axis .hour span { right: 5px; font-size: 10px; }
    .col { min-width: 150px; }
    .next { padding: 5px 12px; font-size: 12px; }
    .sheet { width: 100%; max-width: 100%; max-height: 88%; margin: auto 0 0; }
    .films { width: 100%; max-width: 100%; height: 100%; max-height: 100%; }
    .films-head { padding: 12px 12px 8px; }
    .film-list { padding: 0 12px 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .s { transition: none; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="dates"><span data-i18n="dates">8-18 octubre 2026</span><span data-i18n="edition">59a edició</span></div>
  <div class="controls">

};
const LOCALE = { ca: 'ca', en: 'en-GB' };
const caDe = v => /^[aeiouàèéíòóú]/i.test(v) ? `d'${v}` : `de ${v}`;
const caAt = h => `${h.startsWith('01:') ? 'la' : 'les'} ${h}`;
let LANG;
const fill = (str, vars) => str.replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m);
const t = (key, vars = {}) => { const v = STR[LANG][key] ?? STR.en[key] ?? key; return typeof v === 'function' ? v(vars) : fill(v, vars); };
function tn(key, count, vars = {}) {
  const forms = STR[LANG][key] ?? STR.en[key];
  const form = count === 0 && forms.zero ? forms.zero : forms[new Intl.PluralRules(LOCALE[LANG]).select(count)] ?? forms.other;
  return fill(form, { n: count, ...vars });
}

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('sitges26:' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sitges26:' + k, JSON.stringify(v)); } catch {} },
};
LANG = STR[store.get('lang')] ? store.get('lang') : /^(ca|es)\b/i.test(navigator.language || '') ? 'ca' : 'en';
const marked = new Set(store.get('marked', []));
const pair = (a, b) => [a, b].sort().join('|');
const PRADO = 'Cinema Casino Prado', ESCORXADOR = 'Cinema Escorxador', MERCAT = 'Mercat Vell';
const MELIA = ['Sala Auditori Meliá', 'Brigadoon', 'Sala Tramuntana Meliá'];
const DEFAULT_WALK = {
  [pair(PRADO, ESCORXADOR)]: 10, [pair(PRADO, MERCAT)]: 10, [pair(ESCORXADOR, MERCAT)]: 10,
  [pair(PRADO, MELIA[0])]: 25, [pair(PRADO, MELIA[1])]: 20, [pair(PRADO, MELIA[2])]: 20,
  ...Object.fromEntries(MELIA.flatMap(m => [[pair(ESCORXADOR, m), 15], [pair(MERCAT, m), 20]])),
  [pair(MELIA[0], MELIA[1])]: 5, [pair(MELIA[0], MELIA[2])]: 5, [pair(MELIA[1], MELIA[2])]: 5,
};
const FALLBACK_WALK = 15; // ponytail: only for a venue missing from the table
let walkTimes = { ...DEFAULT_WALK, ...store.get('walkTimes', {}) };
const need = (a, b) => a === b ? 0 : walkTimes[pair(a, b)] ?? FALLBACK_WALK;
let only = store.get('only', false);
const DEFAULT_REST = 8; // hours between the last session of a night and the first one of the next day
let minRest = store.get('minRest', DEFAULT_REST);
const hiddenVenues = new Set(store.get('hiddenVenues', []));

const byId = Object.fromEntries(SCHEDULE.map(s => [s.id, s]));
const byDay = {};
for (const s of SCHEDULE) (byDay[festDay(s.start)] ??= []).push(s);
const days = Object.keys(byDay).sort();
const ORDER = ['Cinema Casino Prado', 'Cinema Escorxador', 'Mercat Vell', 'Sala Auditori Meliá', 'Brigadoon', 'Sala Tramuntana Meliá'];
const SHORT = { 'Cinema Casino Prado': 'Prado', 'Cinema Escorxador': 'Escorxador', 'Sala Auditori Meliá': 'Auditori', 'Sala Tramuntana Meliá': 'Tramuntana' };
const locations = [...new Set(SCHEDULE.map(s => s.location))].sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99));
// Watchlist: film page URL -> 1 (want) or 2 (must-see). Films are keyed by URL, as in the repeat warnings.
let watch = store.get('watch', {});
const saveWatch = () => store.set('watch', watch);
const filmIndex = {};
for (const s of SCHEDULE) for (const f of s.films) (filmIndex[f.url] ??= { ...f, sessions: [] }).sessions.push(s);
for (const f of Object.values(filmIndex)) f.sessions.sort((a, b) => a.start.localeCompare(b.start));
const allFilms = Object.values(filmIndex).sort((a, b) => a.title.localeCompare(b.title, 'ca'));
let current, view = null; // view: what the grid was drawn with, so the now line can move without a redraw

// ?now=2026-10-08T21:30 pretends it is that time, to try the festival-day features early.
const NOW_OVERRIDE = new URLSearchParams(location.search).get('now');
const nowOffset = NOW_OVERRIDE && !isNaN(new Date(NOW_OVERRIDE)) ? new Date(NOW_OVERRIDE) - Date.now() : 0;
const now = () => new Date(Date.now() + nowOffset);
const nowDay = () => festDay(now());
const dayLabel = d => toDate(d).toLocaleDateString(LOCALE[LANG], { weekday: 'short', day: 'numeric' }).replace('.', '');
const venue = l => SHORT[l] || l;

// For each marked session: sessions it overlaps, a too-short location change, films also marked in another session, and the free time to the next one.
function analyse() {
  const list = [...marked].map(id => byId[id]).filter(Boolean).sort((a, b) => a.start.localeCompare(b.start));
  const info = Object.fromEntries(list.map(s => [s.id, { clash: [], tight: [], repeat: [], rest: [], gap: null }]));
  // ponytail: O(n²) over marked sessions only, fine for a few hundred
  for (const a of list) for (const b of list) {
    if (a === b || b.start < a.start || (b.start === a.start && b.id < a.id)) continue;
    const gap = (toDate(b.start) - toDate(a.end)) / 60000;
    if (gap < 0) { info[a.id].clash.push(b); info[b.id].clash.push(a); }
    else if (gap < need(a.location, b.location)) { info[a.id].tight.push([b, gap]); info[b.id].tight.push([a, gap]); }
  }
  // Same film in two marked sessions, matched by film page URL so films inside multi-film sessions count too.
  const byFilm = {};
  for (const s of list) for (const f of s.films) (byFilm[f.url] ??= []).push([s, f]);
  for (const hits of Object.values(byFilm)) if (hits.length > 1)
    for (const [s, f] of hits) for (const [o] of hits) if (o !== s) info[s.id].repeat.push([f, o]);
  list.forEach((s, i) => {
    const next = list[i + 1];
    if (next && festDay(next.start) === festDay(s.start)) info[s.id].gap = [(toDate(next.start) - toDate(s.end)) / 60000, next];
  });
  // Rest: from the last session of each festival day (by end time) to the first one of the next day.
  days.forEach((d, n) => {
    const tonight = list.filter(s => festDay(s.start) === d), tomorrow = list.filter(s => festDay(s.start) === days[n + 1]);
    if (!tonight.length || !tomorrow.length) return;
    const last = tonight.reduce((a, b) => b.end > a.end ? b : a), first = tomorrow[0];
    const rest = (toDate(first.start) - toDate(last.end)) / 60000;
    if (!info[last.id].gap) info[last.id].gap = [rest, first, true];
    if (rest < minRest * 60) { info[last.id].rest.push([first, rest, 'before']); info[first.id].rest.push([last, rest, 'after']); }
  });
  return info;
}

// List the films when a session has several, or when its name is not the film's (e.g. "Sessió Especial").
const norm = t => t.replace(/\s+/g, ' ').trim().toLocaleLowerCase('ca');
const listFilms = s => s.films.length > 1 || (s.films.length === 1 && norm(s.films[0].title) !== norm(s.title));

function notesHtml(s, i) {
  if (!i) return '';
  let notes = i.clash.map(o => `<span class="note warn">${t('noteOverlap', { t: esc(o.title), v: esc(o.location) })}</span>`).join('');
  notes += i.tight.map(([o, g]) => `<span class="note tight">${t('noteTight', { g, v: esc(o.location), w: need(s.location, o.location) })}</span>`).join('');
  notes += i.repeat.map(([f, o]) => {
    const inside = o.films.length > 1 ? t('noteRepeatIn', { t: esc(o.title) }) : '';
    return `<span class="note repeat">${t('noteRepeat', { f: esc(f.title), when: `${dayLabel(o.start)} ${hhmm(toDate(o.start))}`, v: esc(venue(o.location)) })}${inside}</span>`;
  }).join('');
  notes += i.rest.map(([o, m, dir]) => dir === 'before'
    ? `<span class="note rest">${t('noteRestBefore', { d: dur(m), t: esc(o.title), when: `${dayLabel(o.start)} ${hhmm(toDate(o.start))}` })}</span>`
    : `<span class="note rest">${t('noteRestAfter', { d: dur(m), t: esc(o.title), e: hhmm(toDate(o.end)) })}</span>`).join('');
  const warned = i.gap && (i.tight.some(([o]) => o === i.gap[1]) || i.rest.some(([o]) => o === i.gap[1]));
  if (i.gap && i.gap[0] >= 0 && !warned) notes += `<span class="note gap">${t(i.gap[2] ? 'gapTomorrow' : 'gapFree', { d: dur(i.gap[0]), t: esc(i.gap[1].title) })}</span>`;
  return notes;
}

function renderDays(info) {
  document.getElementById('days').innerHTML = days.map(d => {
    const mine = byDay[d].filter(s => marked.has(s.id));
    const bad = mine.some(s => info[s.id].clash.length || info[s.id].tight.length || info[s.id].repeat.length || info[s.id].rest.length);
    const date = new Date(d + 'T12:00');
    const wd = date.toLocaleDateString(LOCALE[LANG], { weekday: 'short' }).replace('.', '');
    return `<button data-day="${d}" aria-pressed="${d === current}" aria-label="${date.toLocaleDateString(LOCALE[LANG], { weekday: 'long', day: 'numeric', month: 'long' })}">
      <small>${wd}</small><strong>${date.getDate()}</strong>${mine.length ? `<i class="${bad ? 'bad' : ''}">${mine.length}</i>` : ''}</button>`;
  }).join('');
}

// A summary counter with the number in bold; on phones an optional shorter wording.
function count(key, n, shortKey) {
  const text = k => tn(k, n, { n: `<b>${n}</b>` });
  return shortKey ? `<span class="long">${text(key)}</span><span class="short">${text(shortKey)}</span>` : text(key);
}

function renderStatus(info) {
  const mine = byDay[current].filter(s => marked.has(s.id));
  const clashes = mine.filter(s => info[s.id].clash.length).length;
  const tights = mine.filter(s => info[s.id].tight.length).length;
  const repeats = mine.filter(s => info[s.id].repeat.length).length;

  const total = byDay[current].length;
  document.getElementById('status').innerHTML = `
    <span><b>${mine.length}</b><span class="long">${t('ofMarked', { total })}</span><span class="short">/${total} ★</span></span>
    <span class="k key"><span class="sw mine"></span>${t('mine')}</span>
    <span class="k"><span class="sw clash"></span>${count('overlaps', clashes)}</span>
    <span class="k"><span class="sw tight"></span>${count('tight', tights, 'tightShort')}</span>
    <span class="k"><span class="sw repeat"></span>${count('repeats', repeats, 'repeatsShort')}</span>
    <span class="k"><span class="sw rest"></span>${count('nights', nights)}</span>
    ${hiddenVenues.size ? `<span class="k hidden-venues"><span class="long">${t('hidden')}</span>${[...hiddenVenues].sort().map(l => {
      const n = mine.filter(s => s.location === l).length;
      return `<button data-show="${esc(l)}" title="${esc(t('showAgain', { v: l }))}">${esc(SHORT[l] || l)}${n ? ` <i>★${n}</i>` : ''} <span aria-hidden="true">+</span></button>`;
    }).join('')}</span>` : ''}
    <span class="hint">${t('hint')}</span>`;
}

function render(day) {
  current = day;
  history.replaceState(null, '', location.search.replace(/[?&]import=[^&]*/, '') + '#' + day);
  const info = analyse();
  renderDays(info);
  renderStatus(info);
  const list = byDay[day];
  const midnight = new Date(day + 'T00:00:00');
  const min = s => (toDate(s) - midnight) / 60000; // minutes since 00:00 of the festival day, >1440 after midnight
  const from = Math.floor(Math.min(...list.map(s => min(s.start))) / 60) * 60;
  const to = Math.ceil(Math.max(...list.map(s => min(s.end))) / 60) * 60;
  const px = m => `calc(${m - from} * var(--px) + 14px)`; // 14px keeps the first hour label clear of the header

  const grid = document.getElementById('grid');
  grid.classList.toggle('only', only);
  const shown = locations.filter(l => !hiddenVenues.has(l));
  grid.style.gridTemplateColumns = `${matchMedia('(max-width: 640px)').matches ? 40 : 52}px repeat(${shown.length}, minmax(180px, 1fr))`;
  grid.innerHTML = '<div class="head corner"></div>' + shown.map(l =>
    `<div class="head"><span><span class="long">${esc(l)}</span><span class="short">${esc(SHORT[l] || l)}</span></span><button class="hide" data-hide="${esc(l)}" title="${esc(t('hide', { v: l }))}" aria-label="${esc(t('hide', { v: l }))}">✕</button></div>`).join('');

  const marks = [];
  for (let m = from; m <= to; m += 30) marks.push(m);
  const lines = axis => marks.map(m => {
    const cls = ['hour', m % 60 && 'half', m % 1440 === 0 && 'midnight'].filter(Boolean).join(' ');
    const label = axis && !(m % 60) ? `<span>${String((m / 60) % 24).padStart(2, '0')}:00</span>` : '';
    return axis && m % 60 ? '' : `<div class="${cls}" style="top:${px(m)}">${label}</div>`;
  }).join('');
  const height = `height:${px(to)}`;

  grid.insertAdjacentHTML('beforeend', `<div class="col axis" style="${height}">${lines(true)}</div>`);
  for (const loc of shown) {
    const blocks = list.filter(s => s.location === loc).map(s => {
      const multi = listFilms(s);
      const filmLine = f => `${f.title}${f.directors.length ? ' — ' + f.directors.join(', ') : ''}`;
      const credits = multi ? s.films.map(filmLine).join('\n') : (s.films[0]?.directors || []).join(', ');
      const creditsHtml = multi ? `<ul>${s.films.map(f => `<li>${esc(filmLine(f))}</li>`).join('')}</ul>` : credits ? `<div class="who">${esc(credits)}</div>` : '';
      const wl = s.films.some(f => watch[f.url]) ? `<span class="wl" title="${t('onWatchlist')}" aria-label="${t('onWatchlist')}">◆</span>` : '';
      const open = `${wl}<button type="button" class="info" data-info="${s.id}" title="${t('details')}" aria-label="${esc(t('detailsFor', { t: s.title }))}">ⓘ</button>`;
      const i = info[s.id];
      const notes = notesHtml(s, i);
      const cls = ['s', i && 'on', i?.repeat.length && 'repeat', i?.rest.length && 'rest', i?.tight.length && 'tight', i?.clash.length && 'clash'].filter(Boolean).join(' ');
      const h = `calc(${min(s.end) - min(s.start)} * var(--px))`;
      return `<div class="${cls}" role="button" tabindex="0" aria-pressed="${!!i}" data-id="${s.id}" data-a="${min(s.start)}" data-b="${min(s.end)}"
        style="top:${px(min(s.start))};height:${h};--hgt:${h};--h:${hue(s.sections[0] || '')}"
        title="${esc(`${s.title}\n${credits}\n${s.sections.join(' · ')}\n${hhmm(toDate(s.start))}–${hhmm(toDate(s.end))} (${s.duration} min)`)}">
        <div class="t"><span>${hhmm(toDate(s.start))}–${hhmm(toDate(s.end))} · ${s.duration}′</span>${open}</div>
        <h3>${esc(s.title)}</h3>${creditsHtml}<div class="sec">${esc(s.sections.join(' · '))}</div>${notes}</div>`;
    }).join('');
    grid.insertAdjacentHTML('beforeend', `<div class="col" style="${height}">${lines(false)}${blocks}</div>`);
  }

  // Hover a session: a band shows its time span across all locations, to spot overlaps.
  grid.insertAdjacentHTML('beforeend', '<div id="band" hidden></div>');
  const band = document.getElementById('band');
  const top = grid.querySelector('.axis').offsetTop;
  grid.querySelectorAll('.s').forEach(el => {
    el.onmouseenter = el.onfocus = () => { const a = +el.dataset.a, b = +el.dataset.b;
      band.hidden = false; band.style.top = `calc(${top}px + ${px(a)})`; band.style.height = `calc(${b - a} * var(--px))`; };
    el.onmouseleave = el.onblur = () => band.hidden = true;
  });

  grid.insertAdjacentHTML('beforeend', '<div id="nowline" hidden></div>');
  view = { day, min, px, top, from, to };
  renderNow();
}

// Red line at the current time on today's grid, and the next marked session with when to leave.
function renderNow() {
  const at = now();
  const line = document.getElementById('nowline');
  if (line && view) {
    const m = view.min(at);
    line.hidden = !(view.day === nowDay() && m >= view.from && m <= view.to);
    line.style.top = `calc(${view.top}px + ${view.px(m)})`;
    line.dataset.t = hhmm(at);
  }
  const bar = document.getElementById('next');
  const mine = [...marked].map(id => byId[id]).filter(Boolean).sort((a, b) => a.start.localeCompare(b.start));
  const iso = at.getTime();
  const inside = mine.find(s => toDate(s.start) <= iso && iso < toDate(s.end));
  const next = mine.find(s => toDate(s.start) > iso);
  const soon = next && (toDate(next.start) - iso) / 3600000 < 18; // only while it is useful today
  if (!inside && !soon) { bar.hidden = true; return; }
  let html = '';
  if (inside) html += `<span class="lbl">${t('now')}</span><b>${esc(inside.title)}</b><span class="when">${esc(venue(inside.location))} · ${t('ends', { e: hhmm(toDate(inside.end)) })}</span>`;
  if (soon) {
    const mins = Math.round((toDate(next.start) - iso) / 60000);
    const prev = inside || [...mine].reverse().find(s => toDate(s.end) <= toDate(next.start) && toDate(s.end) <= iso && festDay(s.start) === festDay(next.start));
    let leave = '';
    if (prev && prev.location !== next.location) {
      const by = new Date(toDate(next.start) - need(prev.location, next.location) * 60000);
      const late = by <= iso;
      leave = `<span class="leave${late ? ' late' : ''}">${late ? t('leaveNow') : t('leaveBy', { v: esc(venue(prev.location)), h: hhmm(by) })}</span>`;
    }
    html += `<span class="lbl">${t('next')}</span><b>${esc(next.title)}</b><span class="when">${hhmm(toDate(next.start))} · ${esc(venue(next.location))} · ${t('inTime', { d: dur(mins) })}</span>${leave}`;
  }
  bar.innerHTML = html;
  bar.dataset.id = (soon ? next : inside).id;
  bar.hidden = false;
}

function scrollToNow() {
  const line = document.getElementById('nowline');

// Walk times panel: one row per pair of venues, saved as overrides of DEFAULT_WALK.

// Replan: each clear needs a second tap within 4 s, then offers Undo for 10 s.
const clears = {
  clearMarks: { count: () => marked.size, take: () => { const old = [...marked]; marked.clear(); store.set('marked', []); return old; },
                give: old => { old.forEach(id => marked.add(id)); store.set('marked', [...marked]); } },
  clearWatch: { count: () => Object.keys(watch).length, take: () => { const old = watch; watch = {}; saveWatch(); updateWatchCount(); return old; },
                give: old => { watch = old; saveWatch(); updateWatchCount(); } },
};
const clearState = {}; // id -> { mode: 'confirm' | 'undo', timer, old }
function renderClear() {
  for (const [id, c] of Object.entries(clears)) {
    const btn = document.getElementById(id), st = clearState[id];
    btn.className = st?.mode || '';
    btn.textContent = st?.mode === 'confirm' ? t('confirmAgain') : st?.mode === 'undo' ? t('undoClear') : tn(id, c.count());
    btn.disabled = !st && !c.count();
  }
}
function setClear(id, st, ms) {
  clearTimeout(clearState[id]?.timer);
  if (st) { st.timer = setTimeout(() => { delete clearState[id]; renderClear(); }, ms); clearState[id] = st; } else delete clearState[id];
  renderClear();
}
document.querySelector('.clear-row').onclick = e => {
  const btn = e.target.closest('button');
  if (!btn || btn.disabled) return;
  const id = btn.id, c = clears[id], st = clearState[id];
  if (!st) return setClear(id, { mode: 'confirm' }, 4000);
  if (st.mode === 'confirm') setClear(id, { mode: 'undo', old: c.take() }, 10000);
  else { c.give(st.old); setClear(id, null); }
  render(current);
};
document.getElementById('minRest').oninput = e => {
  if (e.target.value === '') return;
  minRest = Math.min(16, Math.max(0, +e.target.value || 0));
  store.set('minRest', minRest);
  render(current);
};
document.getElementById('walkRows').oninput = e => {
  const el = e.target.closest('[data-pair]');
  if (!el || el.value === '') return;
  walkTimes[el.dataset.pair] = Math.max(0, Math.round(+el.value) || 0);
  el.closest('label').classList.toggle('changed', walkTimes[el.dataset.pair] !== DEFAULT_WALK[el.dataset.pair]);
  saveWalk();
};
document.getElementById('walkReset').onclick = () => { walkTimes = { ...DEFAULT_WALK }; minRest = DEFAULT_REST; store.set('minRest', minRest); document.getElementById('minRest').value = minRest; saveWalk(); renderWalk(); };

// Sync: the plan travels as a base64url code, alone or inside a ?import= link.
const syncDialog = document.getElementById('syncDialog');
const b64 = { enc: str => btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
              dec: code => new TextDecoder().decode(Uint8Array.from(atob(code.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))) };
const walkOverrides = () => Object.fromEntries(Object.entries(walkTimes).filter(([k, v]) => v !== DEFAULT_WALK[k]));
const planCode = () => b64.enc(JSON.stringify({ v: 1, m: [...marked], h: [...hiddenVenues], w: walkOverrides(), l: watch, r: minRest }));
const planLink = () => `${location.origin}${location.pathname}?import=${planCode()}`;
const describe = p => [tn('markedSessions', p.m.length), tn('watchFilms', Object.keys(p.l || {}).length), tn('hiddenVenues', p.h.length), tn('walkEdits', Object.keys(p.w).length)].join(', ');
function parsePlan(text) {
  const raw = text.trim();
  if (!raw) return null;
  let code = raw;
  try { code = new URL(raw).searchParams.get('import') || raw; } catch {}
  try {
    const p = JSON.parse(b64.dec(code));
    if (p.v !== 1 || !Array.isArray(p.m) || !Array.isArray(p.h) || typeof p.w !== 'object') return null;
    const l = p.l && typeof p.l === 'object' ? Object.fromEntries(Object.entries(p.l).filter(([u, v]) => filmIndex[u] && (v === 1 || v === 2))) : {};
    const r = Number.isFinite(p.r) && p.r >= 0 && p.r <= 16 ? p.r : DEFAULT_REST;
    return { r, m: p.m.filter(id => byId[id]), h: p.h.filter(l => locations.includes(l)), w: Object.fromEntries(Object.entries(p.w).filter(([k, v]) => k in DEFAULT_WALK && Number.isFinite(v) && v >= 0)), l };
  } catch { return null; }
}
const syncInput = document.getElementById('syncInput'), syncPreview = document.getElementById('syncPreview'), syncImport = document.getElementById('syncImport');
function previewImport() {
  const p = parsePlan(syncInput.value);
  syncImport.disabled = !p;
  syncPreview.textContent = !syncInput.value.trim() ? '' : p ? t('replacesWith', { d: describe(p) }) : t('invalidPlan');
}
function openSync(prefill = '') {
  document.getElementById('syncSummary').textContent = t('thisDevice', { d: describe({ m: [...marked], h: [...hiddenVenues], w: walkOverrides(), l: watch }) });
  document.getElementById('syncCode').value = planCode();
  syncInput.value = prefill;
  previewImport();
  syncDialog.showModal();
}
function flash(btn, text) { const old = btn.textContent; btn.textContent = text; setTimeout(() => btn.textContent = old, 1800); }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); flash(btn, t('copied')); }
  catch { const code = document.getElementById('syncCode'); code.focus(); code.select(); flash(btn, t('selectCopy')); }
}
document.getElementById('syncOpen').onclick = () => openSync();
document.getElementById('syncCopy').onclick = e => copy(planCode(), e.currentTarget);
document.getElementById('syncShare').onclick = async e => {
  const btn = e.currentTarget;
  if (navigator.share) { try { await navigator.share({ title: t('shareTitle'), url: planLink() }); return; } catch (err) { if (err.name === 'AbortError') return; } }
  copy(planLink(), btn);
};
syncInput.oninput = previewImport;
syncImport.onclick = () => {
  const p = parsePlan(syncInput.value);
  if (!p) return;
  marked.clear(); p.m.forEach(id => marked.add(id));
  hiddenVenues.clear(); p.h.forEach(l => hiddenVenues.add(l));
  walkTimes = { ...DEFAULT_WALK, ...p.w };
  watch = p.l; saveWatch(); updateWatchCount();
  minRest = p.r; store.set('minRest', minRest);
  store.set('marked', [...marked]); store.set('hiddenVenues', [...hiddenVenues]); store.set('walkTimes', walkOverrides());
  render(current);
  syncPreview.textContent = t('imported', { d: describe(p) });
  syncImport.disabled = true;
  document.getElementById('syncSummary').textContent = t('thisDevice', { d: describe(p) });
  document.getElementById('syncCode').value = planCode();
};

// Films view: all films or the watchlist, with the status of each watchlist film.
const filmsDialog = document.getElementById('filmsDialog');
const filmSearch = document.getElementById('filmSearch'), filmSection = document.getElementById('filmSection');
let filmsTab = 'all';
const updateWatchCount = () => { const n = Object.keys(watch).length; document.getElementById('watchCount').textContent = n || ''; };
function toggleWatch(url, level) {

const when = s => `${dayLabel(s.start)} ${hhmm(toDate(s.start))}`;

// Why a screening can't be added: hidden venue, or it overlaps / leaves too little walk time with a marked session.
function blockedBy(s, mine) {
  if (hiddenVenues.has(s.location)) return t('isHidden', { v: venue(s.location) });
  for (const o of mine) {
    if (o === s) continue;
    const [a, b] = o.start < s.start ? [o, s] : [s, o];
    const gap = (toDate(b.start) - toDate(a.end)) / 60000;
    if (gap < 0) return t('overlapsWith', { t: o.title });
    if (gap < need(a.location, b.location)) return t('tooClose', { t: o.title });
  }
  return null;
}
function filmStatus(f, mine) {
  const seen = f.sessions.find(s => marked.has(s.id));
  if (seen) return { key: 'covered', rank: 2, text: t('covered', { when: when(seen), v: venue(seen.location) }) };
  const reasons = f.sessions.map(s => [s, blockedBy(s, mine)]);
  const free = reasons.filter(([, r]) => !r).length;
  if (free) return { key: 'open', rank: 1, text: tn('notPlanned', f.sessions.length, { free }) };
  return { key: 'blocked', rank: 0, text: t('cannotFit', { r: reasons.map(([s, r]) => `${when(s)} ${r}`).join('; ') }) };
}

function renderFilms() {
  const q = norm(filmSearch.value), sec = filmSection.value;
  const mine = [...marked].map(id => byId[id]).filter(Boolean);
  document.getElementById('tabWatch').textContent = t('tabWatch', { n: Object.keys(watch).length });
  document.querySelectorAll('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === filmsTab));
  let list = allFilms.filter(f => (filmsTab === 'all' || watch[f.url]) && (!sec || f.sections.includes(sec))
    && (!q || norm(f.title).includes(q) || f.directors.some(d => norm(d).includes(q))));
  const status = new Map(list.filter(f => watch[f.url]).map(f => [f, filmStatus(f, mine)]));
  if (filmsTab === 'watch') list.sort((a, b) => (watch[b.url] - watch[a.url]) || (status.get(a).rank - status.get(b).rank) || a.title.localeCompare(b.title, 'ca'));

  const wl = allFilms.filter(f => watch[f.url]).map(f => filmStatus(f, mine).key);
  const n = k => wl.filter(x => x === k).length;
  document.getElementById('filmsSummary').innerHTML = filmsTab === 'watch'
    ? (wl.length ? t('watchSummary', { c: n('covered'), n: wl.length, o: n('open'), b: tn('noFit', n('blocked'), { n: `<b>${n('blocked')}</b>` }) }) : '')
    : tn('filmCount', list.length) + (wl.length ? t('onYourList', { n: wl.length }) : '');

  document.getElementById('filmList').innerHTML = list.length ? list.map(f => {
    const w = watch[f.url], st = status.get(f);
    const shows = f.sessions.map(s => {
      const r = !marked.has(s.id) && blockedBy(s, mine);
      return `<button type="button" data-goto="${s.id}" class="${marked.has(s.id) ? 'on' : r ? 'off' : ''}" title="${esc(`${s.title} · ${s.location}${r ? ` · ${r}` : ''}`)}">${marked.has(s.id) ? '★ ' : ''}${when(s)} · ${esc(venue(s.location))}</button>`;
    }).join('');
    return `<li class="film">
      ${f.image ? `<img src="${esc(f.image)}" alt="" loading="lazy">` : '<span></span>'}
      <div class="ft">${esc(f.title)}</div>
      <div class="acts">
        ${w ? `<button type="button" class="must${w === 2 ? ' on' : ''}" data-must="${esc(f.url)}" title="${t('mustSee')}" aria-label="${t('mustSee')}" aria-pressed="${w === 2}">!</button>` : ''}
        <button type="button" class="${w ? 'on' : ''}" data-wl="${esc(f.url)}" aria-pressed="${!!w}" aria-label="${w ? t('removeFromList') : t('addToList')}">${w ? '✓' : '+'}</button>
      </div>
      <div class="fd">${esc(f.directors.join(', '))}${f.sections.length ? ` <span class="fsec">· ${esc(f.sections.join(' · '))}</span>` : ''}</div>
      ${st ? `<div class="st ${st.key}">${esc(st.text)}</div>` : ''}
      <div class="fs">${shows}</div>
    </li>`;
  }).join('') : `<li class="empty">${filmsTab === 'watch' && !Object.keys(watch).length ? t('emptyList') : t('noMatch')}</li>`;
}
document.getElementById('filmsOpen').onclick = () => { renderFilms(); filmsDialog.showModal(); };
filmSearch.oninput = filmSection.onchange = renderFilms;
filmsDialog.onclick = e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { filmsTab = tab.dataset.tab; document.getElementById('filmList').scrollTop = 0; return renderFilms(); }
  const add = e.target.closest('[data-wl]');
  if (add) { toggleWatch(add.dataset.wl); return renderFilms(); }
  const must = e.target.closest('[data-must]');
  if (must) { toggleWatch(must.dataset.must, watch[must.dataset.must] === 2 ? 1 : 2); return renderFilms(); }
  const go = e.target.closest('[data-goto]');
  if (go) {
    const id = +go.dataset.goto;
    filmsDialog.close();
    if (hiddenVenues.has(byId[id].location)) setVenue(byId[id].location, false);
    render(festDay(byId[id].start));
    document.querySelector(`.s[data-id="${id}"]`)?.scrollIntoView({ block: 'center', inline: 'center' });
    openSheet(id);
  }
};
updateWatchCount();

document.getElementById('next').onclick = e => {
  const id = +e.currentTarget.dataset.id;
  render(festDay(byId[id].start));
  document.querySelector(`.s[data-id="${id}"]`)?.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
};

// Texts in the static HTML: data-i18n (text), data-i18n-html (trusted markup), data-i18n-attr ("attr:key,attr:key").
function applyLanguage() {
  document.documentElement.lang = LANG;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-attr]').forEach(el => el.dataset.i18nAttr.split(',').forEach(pairs => {
    const [attr, key] = pairs.split(':');
    el.setAttribute(attr, t(key));
  }));
  document.getElementById('lang').value = LANG;
  renderSections();
  renderClear();
}
document.getElementById('lang').onchange = e => {
  LANG = e.target.value;
  store.set('lang', LANG);
  applyLanguage();
  render(current);
};
applyLanguage();

// Start on the day in the link, else today during the festival, else the first day.
const hashDay = location.hash.slice(1);
render(days.includes(hashDay) ? hashDay : days.includes(nowDay()) ? nowDay() : days[0]);
if (current === nowDay()) scrollToNow();
setInterval(renderNow, 30000);
const importCode = new URLSearchParams(location.search).get('import');
if (importCode) {
  history.replaceState(null, '', location.pathname + (NOW_OVERRIDE ? `?now=${encodeURIComponent(NOW_OVERRIDE)}` : '') + location.hash);
  openSync(importCode);
}
matchMedia('(max-width: 640px)').addEventListener('change', () => render(current));
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
